plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

fabricApi {
    configureDataGeneration()
}

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDirs('../common/src/main/resources', '../common/src/main/generated/resources')

loom {
    runs {
        server { runDir 'run-server' }
    }
}

tasks.named('runServer', JavaExec) { standardInput = System.in }

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("com.electronwill.night-config:toml:3.6.6")
    implementation include("com.electronwill.night-config:core:3.6.6")
}

processResources {
    // Capture plain values during configuration; copy actions run later.
    def resourceProperties = [
        version: project.version.toString(),
        minecraft_version_range: project.minecraft_version_range.toString()
    ]
    inputs.properties(resourceProperties)

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def licenseSuffix = project.base.archivesName.get()
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${licenseSuffix}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}


tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000'] }
