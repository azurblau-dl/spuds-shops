plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.148'
}
base { archivesName = 'spuds-shops-neoforge-26.1.2' }
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
neoForge {
 version = project.neo_version
 mods { spudaciousshops { sourceSet(sourceSets.main) } }
}
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDirs('../common/src/main/resources', '../common/src/main/generated/resources')
dependencies {
 implementation 'com.electronwill.night-config:core:3.6.6'
 implementation 'com.electronwill.night-config:toml:3.6.6'
 jarJar('com.electronwill.night-config:core:[3.6.6,4.0)') { version { prefer '3.6.6' } }
 jarJar('com.electronwill.night-config:toml:[3.6.6,4.0)') { version { prefer '3.6.6' } }
}
processResources {
 def properties = [version: project.version.toString()]
 inputs.properties(properties)
 filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
jar { from(rootProject.file('LICENSE')) }
