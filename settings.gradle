pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
            content { includeGroupByRegex 'net\\.fabricmc.*'; includeGroup 'fabric-loom' }
        }
        maven { url = 'https://maven.neoforged.net/releases'; content { includeGroupByRegex 'net[.]neoforged.*' } }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'spuds-shops'
include 'common', 'fabric', 'neoforge'
